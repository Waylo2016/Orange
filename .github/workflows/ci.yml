name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: 
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Orange.sln
      
      - name: Apply Formatting
        if: github.ref_name != 'main'
        run: |
          dotnet format Orange.sln
          if [[ -n $( git status --porcelain ) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore: apply dotnet format"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi


      - name: Check formatting
        run: dotnet format Orange.sln --verify-no-changes --severity warn

      - name: Build
        run: dotnet build Orange.sln --no-restore --configuration Release -warnaserror

      - name: Test
        run: |
          if [ -f Orange.UnitTests/Orange.UnitTests.csproj ]; then
            dotnet test Orange.UnitTests/Orange.UnitTests.csproj --no-build --configuration Release
          else
            echo "No test project found yet, skipping dotnet test."
          fi
        shell: bash